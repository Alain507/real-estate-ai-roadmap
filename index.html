<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente inmobiliario bilingüe para Chiriquí (demo)</title>
<meta name="description" content="Demo: asistente bilingüe que califica compradores, explica el proceso de compra en Panamá y entrega una ficha de lead lista para el CRM.">
<style>
:root{
  --forest:#12372f; --forest-2:#1d5246; --mist:#eaf0ee; --paper:#ffffff;
  --ink:#14201c; --muted:#56655f; --line:#c9d5d0;
  --cherry:#a8322b; --gold:#b98a1f; --gold-soft:#f4ead0;
  --serif: Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{background:var(--forest);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:var(--serif);font-size:1.05rem;letter-spacing:.01em;min-width:0}
.brand small{display:block;font-family:var(--sans);font-size:.75rem;opacity:.75}
.lang{display:flex;flex-shrink:0;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 12px;cursor:pointer;font-size:.85rem}
.lang button[aria-pressed="true"]{background:#fff;color:var(--forest);font-weight:600}

/* intro */
.intro{background:var(--forest);color:#fff;padding:18px 0 96px}
.intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4.6vw,2.9rem);line-height:1.12;margin:0 0 12px;max-width:21ch}
.intro p{margin:0;max-width:62ch;color:#d5e3de}

/* stage: chat + ficha */
.stage{display:grid;gap:20px;margin-top:-72px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.stage{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}

.chat{background:var(--paper);border-radius:14px;box-shadow:0 10px 30px rgba(18,55,47,.18);display:flex;flex-direction:column;overflow:hidden;min-height:520px}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-head strong{font-family:var(--serif);font-size:1.05rem}
.linkbtn{background:none;border:0;color:var(--forest-2);text-decoration:underline;cursor:pointer;padding:4px;font-size:.88rem}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:56vh;min-height:300px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{background:var(--mist);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--forest);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:6px;font-size:.92rem;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.chip{border:1.5px solid var(--forest-2);background:#fff;color:var(--forest);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem}
.chip:hover{background:var(--forest);color:#fff}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.btn{background:var(--cherry);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.quiet{background:#fff;color:var(--forest);border:1.5px solid var(--forest-2)}
.contact{padding:0 16px 14px;display:grid;gap:8px}
.contact label{font-size:.88rem;color:var(--muted);display:grid;gap:4px}
.contact input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.contact .check{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.contact .row{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--cherry);font-size:.88rem;margin:0}

/* ficha */
.ficha{background:var(--paper);border-radius:14px;box-shadow:0 10px 30px rgba(18,55,47,.18);padding:18px;border-top:6px solid var(--gold)}
.ficha h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 2px}
.ficha .sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.fields{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.94rem}
.fields dt{color:var(--muted)}
.fields dd{margin:0;font-weight:600}
.fields dd.empty{font-weight:400;color:#9aa8a3}
.score{margin:16px 0 8px}
.bar{height:10px;background:var(--mist);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--forest-2);transition:width .5s ease}
.tier{display:inline-block;border-radius:6px;padding:3px 10px;font-weight:700;font-size:.9rem;margin-right:8px}
.tier.hot{background:var(--cherry);color:#fff}
.tier.warm{background:var(--gold-soft);color:#6b4e08}
.tier.cold{background:var(--mist);color:var(--forest)}
.ficha h3{font-family:var(--serif);font-size:1.02rem;margin:18px 0 6px}
.ficha ul{margin:0;padding-left:18px;font-size:.92rem}
.listing{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.listing b{display:block}
.listing .price{font-family:var(--serif);font-size:1.05rem}
.tag{display:inline-block;font-size:.78rem;border-radius:4px;padding:1px 7px;margin-top:4px;background:var(--mist);color:var(--forest)}
.tag.warn{background:#f6dedb;color:#7a1f1a}
pre.json{background:var(--ink);color:#d7efe6;border-radius:10px;padding:12px;font-size:.78rem;overflow:auto;max-height:240px;margin:8px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{padding:8px 12px;font-size:.88rem}

/* explainer */
.explain{padding:48px 0 24px}
.explain h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 6px}
.explain > .wrap > p{max-width:68ch;color:var(--muted);margin:0 0 20px}
.cols{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:800px){.cols{grid-template-columns:repeat(3,1fr)}}
.cols h3{font-family:var(--serif);font-size:1.1rem;margin:0 0 4px;padding-top:10px;border-top:3px solid var(--forest)}
.cols p{margin:0;font-size:.95rem}
.flow{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px;counter-reset:s}
@media (min-width:800px){.flow{grid-template-columns:repeat(4,1fr)}}
.flow li{counter-increment:s;background:var(--paper);border-radius:10px;padding:12px 14px;font-size:.92rem}
.flow li::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--forest);color:#fff;font-size:.8rem;font-weight:700;margin-right:8px}
.flow b{display:inline}
.flow span{display:block;color:var(--muted);margin-top:4px}

footer{padding:26px 0 40px;font-size:.86rem;color:var(--muted)}
footer p{margin:0 0 6px;max-width:80ch}
footer a{color:var(--forest-2)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span data-i18n="brand"></span><small data-i18n="brandSub"></small></div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">Español</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
</header>

<section class="intro">
  <div class="wrap">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="lead"></p>
  </div>
</section>

<main class="wrap">
  <div class="stage">
    <section class="chat" aria-label="Chat">
      <div class="chat-head">
        <strong data-i18n="chatTitle"></strong>
        <button type="button" class="linkbtn" id="restart" data-i18n="restart"></button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="contact" id="contact" hidden novalidate>
        <label><span data-i18n="fName"></span><input type="text" id="cName" autocomplete="name"></label>
        <label><span data-i18n="fContact"></span><input type="text" id="cHow" autocomplete="email"></label>
        <label class="check"><input type="checkbox" id="cOk"><span data-i18n="fConsent"></span></label>
        <p class="err" id="cErr" role="alert" hidden></p>
        <div class="row">
          <button class="btn" type="submit" data-i18n="fSave"></button>
          <button class="btn quiet" type="button" id="cSkip" data-i18n="fSkip"></button>
        </div>
      </form>
      <form class="composer" id="composer">
        <input type="text" id="text" autocomplete="off" data-i18n-ph="placeholder" aria-label="Mensaje">
        <button class="btn" type="submit" data-i18n="send"></button>
      </form>
    </section>

    <aside class="ficha" aria-label="Ficha del lead">
      <h2 data-i18n="fichaTitle"></h2>
      <p class="sub" data-i18n="fichaSub"></p>
      <dl class="fields" id="fields"></dl>
      <div id="result"></div>
    </aside>
  </div>
</main>

<section class="explain">
  <div class="wrap">
    <h2 data-i18n="exTitle"></h2>
    <p data-i18n="exLead"></p>
    <div class="cols">
      <div><h3 data-i18n="c1t"></h3><p data-i18n="c1"></p></div>
      <div><h3 data-i18n="c2t"></h3><p data-i18n="c2"></p></div>
      <div><h3 data-i18n="c3t"></h3><p data-i18n="c3"></p></div>
    </div>
    <ol class="flow">
      <li><b data-i18n="s1t"></b><span data-i18n="s1"></span></li>
      <li><b data-i18n="s2t"></b><span data-i18n="s2"></span></li>
      <li><b data-i18n="s3t"></b><span data-i18n="s3"></span></li>
      <li><b data-i18n="s4t"></b><span data-i18n="s4"></span></li>
    </ol>
  </div>
</section>

<footer>
  <div class="wrap">
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
    <p><span data-i18n="foot3"></span> <a href="https://github.com/Alain507">github.com/Alain507</a></p>
  </div>
</footer>

/* ---------- Pure logic ---------- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/\s+/g, " ").trim();
const money = n => "$" + Math.round(n).toLocaleString("en-US");

function parseBudget(text) {
  const m = norm(text).match(/(\d[\d.,]*)\s*(k|mil|millones|millon|million|m)?\b/);
  if (!m) return null;
  let n = parseFloat(m[1].replace(/[.,](?=\d{3}\b)/g, "").replace(",", "."));
  if (isNaN(n)) return null;
  const suf = m[2] || "";
  if (suf === "k" || suf === "mil") n *= 1e3;
  else if (suf) n *= 1e6;
  else if (n < 5000) n *= 1e3;
  return STEPS[3].opts.find(o => n >= o.min && n < o.max) || STEPS[3].opts[3];
}

function matchOption(step, text) {
  if (step.id === "budget") return parseBudget(text);
  const t = norm(text);
  const exact = step.opts.find(o => norm(o.es) === t || norm(o.en) === t);
  if (exact) return exact;
  return step.opts.find(o => (o.kw || []).some(k => t.includes(k))) || null;
}

function matchKB(text) {
  const t = norm(text);
  let best = null, top = 0;
  for (const e of KB) {
    const s = e.kw.reduce((n, k) => n + (t.includes(k) ? (k.includes(" ") ? 2 : 1) : 0), 0);
    if (s > top) { top = s; best = e; }
  }
  return best;
}

function findMatches(a) {
  const band = STEPS[3].opts.find(o => o.v === a.budget);
  const scored = LISTINGS.map(l => {
    let s = 0;
    if (a.zone === "any" || l.zone === a.zone) s += 3;
    if (l.type === a.type) s += 3;
    if (band && l.price >= band.min * 0.85 && l.price <= band.max * 1.15) s += 3;
    return { l, s };
  }).sort((x, y) => y.s - x.s || x.l.price - y.l.price);
  const exact = scored.filter(x => x.s === 9);
  return { exact: exact.length > 0, items: (exact.length ? exact : scored).slice(0, 3).map(x => x.l) };
}

function scoreLead(a, contact) {
  const opt = (id, v) => STEPS.find(s => s.id === id).opts.find(o => o.v === v);
  const parts = [
    { k: "r_timeline", pts: opt("timeline", a.timeline).pts, max: 35 },
    { k: "r_fin", pts: opt("financing", a.financing).pts, max: 30 },
    { k: "r_contact", pts: contact ? 20 : 0, max: 20 },
    { k: "r_budget", pts: a.budget ? 10 : 0, max: 10 },
    { k: "r_purpose", pts: a.purpose ? 5 : 0, max: 5 }
  ];
  const total = parts.reduce((n, p) => n + p.pts, 0);
  const tier = total >= 70 ? "hot" : total >= 40 ? "warm" : "cold";
  return { total, tier, parts };
}

if (typeof module !== "undefined") module.exports = { STEPS, KB, LISTINGS, UI, norm, parseBudget, matchOption, matchKB, findMatches, scoreLead };

    m.items.forEach(l => {
      const c = el("div", "listing");
      c.appendChild(el("b", "", l[lang]));
      c.appendChild(el("span", "price", money(l.price)));
      c.appendChild(document.createTextNode("  " + (l.beds ? l.beds + " " + t("beds") + ", " : "") + l.m2.toLocaleString("en-US") + " m² (" + l.id + ")"));
      c.appendChild(el("br"));
      c.appendChild(el("span", "tag" + (l.titled ? "" : " warn"), l.titled ? t("titled") : t("rop")));
      r.appendChild(c);
    });

    r.appendChild(el("h3", "", t("crm")));
    const json = JSON.stringify(leadJSON(), null, 2);
    r.appendChild(el("pre", "json", json));
    const act = el("div", "actions");
    const cp = el("button", "btn quiet", t("copy")); cp.type = "button";
    cp.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(json); cp.textContent = t("copied"); }
      catch (e) { const sel = window.getSelection(); sel.selectAllChildren(r.querySelector("pre")); }
    });
    const dl = el("button", "btn quiet", t("download")); dl.type = "button";
    dl.addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      a.download = S.lead.id + ".json"; a.click(); URL.revokeObjectURL(a.href);
    });
    act.appendChild(cp); act.appendChild(dl); r.appendChild(act);
  }

  function leadJSON() {
    const { sc, m, id, at } = S.lead;
    return {
      leadId: id, createdAt: at, language: lang, source: "web-assistant-demo",
      profile: Object.assign({}, S.answers),
      contact: S.contact,
      consent: S.consent && S.consent.given ? { given: true, timestamp: S.consent.at, purpose: "agent-contact", noticeVersion: "1.0", legalBasis: "Ley 81 de 2019" } : { given: false },
      score: sc.total, tier: sc.tier,
      scoreBreakdown: sc.parts.map(p => ({ factor: p.k.slice(2), points: p.pts, max: p.max })),
      matchedListings: m.items.map(l => l.id),
      flags: m.items.some(l => !l.titled) ? ["match-includes-rights-of-possession"] : []
    };
  }

  function draw() { drawStatic(); drawLog(); drawChips(); drawFicha(); }

  /* events */
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; draw(); }));
  $("restart").addEventListener("click", reset);
  $("composer").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("text").value.trim(); if (!v) return;
    $("text").value = ""; onText(v); draw();
  });
  $("contact").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("cName").value.trim(), how = $("cHow").value.trim(), err = $("cErr");
    const msg = !name ? "errName" : !how ? "errHow" : !$("cOk").checked ? "errOk" : null;
    if (msg) { err.textContent = t(msg); err.hidden = false; return; }
    err.hidden = true;
    S.contact = { name, how }; S.consent = { given: true, at: new Date().toISOString() };
    $("cName").value = ""; $("cHow").value = ""; $("cOk").checked = false;
    say(l => UI[l].saved); finish(); draw();
  });
  $("cSkip").addEventListener("click", () => { heard(l => UI[l].fSkip); S.consent = { given: false }; finish(); draw(); });

  reset();
})();
</script>
</body>
</html>
